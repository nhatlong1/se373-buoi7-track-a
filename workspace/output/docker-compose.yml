# SE373 final project - single-host stack (4 vCPU / 12 GB RAM)
# Memory limits are deliberate: they enforce the budget from the decision record.
# Pin image versions before your final submission for reproducibility.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bizcare
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-buffer-size=16M
      - --max-connections=50
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql
    mem_limit: 2g
    ports:
      - "3306:3306"

  seaweedfs:
    image: seaweedfs/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.port=9333 -volume.port=8080
    volumes:
      - seaweeddata:/data
    mem_limit: 768m
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master
      - "8080:8080"   # volume / filer

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
      - ./qdrant-config.yaml:/qdrant/config/production.yaml:ro
    mem_limit: 2g
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC

  # Your FastAPI backend. Build from your own Dockerfile.
  # The embedding model (embeddinggemma2, Q4, LiteRT-LM) is loaded
  # in-process via LiteRT-LM.
  # backend:
  #   build: .
  #   depends_on: [mysql, seaweedfs, qdrant]
  #   mem_limit: 1536m
  #   ports:
  #     - "8000:8000"

volumes:
  mysqldata:
  seaweeddata:
  qdrantdata:
